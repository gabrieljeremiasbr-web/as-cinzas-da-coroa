<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>As Cinzas da Coroa</title><link rel="stylesheet" href="style.css?v=6"></head><body>
<main class="landing"><div class="frame"></div><section class="intro"><p class="eyebrow">UM RPG DE FANTASIA MEDIEVAL</p><div class="crest" aria-hidden="true">♛</div><div class="ornament">──── ◆ ────</div><h1>As Cinzas<br><em>da Coroa</em></h1><p class="subtitle">Reinos caem. Lendas sobrevivem.</p><button id="enter">Iniciar aventura <span>→</span></button><p class="edition">CRÔNICAS DE VALDORIA</p></section></main>
<section id="auth" class="auth-screen" hidden><button id="back" class="back" type="button">← Voltar ao início</button><div class="auth-card"><div class="crest" aria-hidden="true">♛</div><p class="eyebrow">AS CINZAS DA COROA</p><h2 id="auth-title">Entre no reino</h2><div class="auth-tabs"><button type="button" id="login-tab" aria-pressed="true">Entrar</button><button type="button" id="register-tab" aria-pressed="false">Criar conta</button></div><form id="auth-form"><label id="name-field" hidden>Nome<input id="name" autocomplete="nickname" maxlength="80"></label><label>E-mail<input id="email" type="email" autocomplete="email" required></label><label id="password-field">Senha<span class="password-wrap"><input id="password" type="password" autocomplete="current-password" minlength="8" required><button type="button" class="password-toggle" data-password="password" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18"/></svg></button></span></label><label id="confirm-field" hidden>Confirmar senha<span class="password-wrap"><input id="confirm" type="password" autocomplete="new-password"><button type="button" class="password-toggle" data-password="confirm" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18"/></svg></button></span></label><button id="submit" type="submit">Entrar</button></form><button id="forgot" class="link" type="button">Esqueci minha senha</button><p id="message" role="status" aria-live="polite"></p><p class="auth-note">Acesso seguro com Supabase.</p></div></section><section id="account" class="auth-screen" hidden><div class="auth-card"><h2>Bem-vindo ao reino</h2><p id="account-name"></p><p>As áreas de jogo serão adicionadas em breve.</p><button id="logout">Sair da conta</button><p id="account-message" role="status"></p></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" defer></script><script src="script.js?v=6" defer></script></body></html>
