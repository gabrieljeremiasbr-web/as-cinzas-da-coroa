<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17120d">
<meta name="description" content="As Cinzas da Coroa — central de aventuras de fantasia medieval.">
<title>As Cinzas da Coroa • RPG Medieval</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">✦ CRÔNICAS DE VALDORIA ✦</div>
    <div class="crest" aria-hidden="true">♛</div>
    <h1>As Cinzas da Coroa</h1>
    <p>Quando a última coroa se tornar cinzas, quem escreverá a história do reino?</p>
    <div class="roles" aria-label="Escolher área do RPG">
      <button id="master" type="button">♛ Área do Mestre</button>
      <button id="player" type="button">⚔ Área do Jogador</button>
    </div>
    <p class="hero-hint">Escolha uma área para explorar sua aventura.</p>
  </div>
</header>
<div class="layout">
  <nav id="navigation" aria-label="Seções do RPG"></nav>
  <main id="app" aria-live="polite"></main>
</div>
<footer>✦ AS CINZAS DA COROA ✦ <span>Um mundo medieval de aventuras</span></footer>
<script src="script.js" defer></script>
</body>
</html>
